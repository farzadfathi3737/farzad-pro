# For a VPS: `docker compose up -d --build`
services:
  v2gate:
    build: .
    container_name: v2gate
    restart: unless-stopped
    ports:
      - "443:3000"          # public port → container port
    environment:
      PORT: "3000"
      PUBLIC_PORT: "443"
      TLS_MODE: "self"      # self-signed TLS; set to "proxy" if behind Cloudflare/nginx
      # HOST: "your.domain.com"
      # PANEL_PASSWORD: "change-me"
    volumes:
      - ./data:/app/data
